<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CAGR Club: learn equity research and finance with roadmaps, lessons, interview questions with worked answers, a daily set and hands-on tools.">
<meta name="theme-color" content="#0B1315">
<title>CAGR Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: an app shell. A quiet sidebar holds navigation, a slim top bar holds search and the streak, and each view reads left-aligned in one column.
   The one loud element is the compounding curve: it draws itself in every roadmap card and drives the calculator on the home page. */
:root{
  --bg:#0B1315; --surface:#111B1E; --raised:#162327; --hover:#1C2D32; --line:#223439; --fg:#E8F0EE; --muted:#8DA19F; --faint:#62787A;
  --accent:#F5B93A; --accent-ink:#1B1400; --accent-soft:#33290F; --link:#F6CA6A;
  --good:#5FD4A4; --good-soft:#12352B; --bad:#FF8F8F; --bad-soft:#3F191C; --warn:#F2B84B; --warn-soft:#3A2D11;
  --h1:#F5B93A; --h2:#6FB8F5; --h3:#F08A6C; --h4:#B19CF7; --h5:#5FD4A4; --h6:#F088B0;
  --shadow:none; --glass:rgba(11,19,21,.78);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif; --body:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F1F4F2; --surface:#FFFFFF; --raised:#F6F8F6; --hover:#EAEFEC; --line:#DAE2DE; --fg:#0F1E1E; --muted:#526563; --faint:#8A9A97;
  --accent:#F2B02A; --accent-ink:#1B1400; --accent-soft:#FBECC4; --link:#855900;
  --good:#0E7A51; --good-soft:#D9F2E5; --bad:#B4232F; --bad-soft:#FADFE1; --warn:#8A5900; --warn-soft:#FAEBC8;
  --h1:#C48700; --h2:#1F6FBF; --h3:#C5533A; --h4:#6B4FD8; --h5:#0E8A5E; --h6:#C2417A;
  --shadow:0 1px 2px rgba(15,30,30,.05),0 8px 24px -16px rgba(15,30,30,.18); --glass:rgba(241,244,242,.8); color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F1F4F2; --surface:#FFFFFF; --raised:#F6F8F6; --hover:#EAEFEC; --line:#DAE2DE; --fg:#0F1E1E; --muted:#526563; --faint:#8A9A97;
  --accent:#F2B02A; --accent-ink:#1B1400; --accent-soft:#FBECC4; --link:#855900;
  --good:#0E7A51; --good-soft:#D9F2E5; --bad:#B4232F; --bad-soft:#FADFE1; --warn:#8A5900; --warn-soft:#FAEBC8;
  --h1:#C48700; --h2:#1F6FBF; --h3:#C5533A; --h4:#6B4FD8; --h5:#0E8A5E; --h6:#C2417A;
  --shadow:0 1px 2px rgba(15,30,30,.05),0 8px 24px -16px rgba(15,30,30,.18); --glass:rgba(241,244,242,.8); color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:clamp(30px,4.4vw,46px);line-height:1.06;letter-spacing:-.03em}
h2{font-size:22px;line-height:1.2;letter-spacing:-.02em}
h3{font-size:16.5px;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
a{color:var(--link);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lede{color:var(--muted);font-size:16.5px;line-height:1.55;max-width:58ch}
.small{font-size:13px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:18px 14px;border-right:1px solid var(--line);background:var(--bg);overflow-y:auto;z-index:21}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font:600 17px/1 var(--display);letter-spacing:-.02em;padding:6px 8px}
.brand svg{width:26px;height:26px;flex:none}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:12px;color:var(--faint);padding:0 10px 6px}
.nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav-a:hover{background:var(--surface);color:var(--fg)}
.nav-a.on{background:var(--raised);color:var(--fg)}
.nav-a.on .i{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.streak-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.streak-card b{font:600 22px/1 var(--display)}
.week{display:flex;gap:5px}
.week i{flex:1;height:5px;border-radius:3px;background:var(--hover)}
.week i.on{background:var(--accent)}
.ghost{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.ghost:hover{background:var(--surface);color:var(--fg)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.menu{display:none;background:none;border:0;padding:6px;cursor:pointer;color:var(--fg)}
.crumb{flex:1;min-width:0;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}
.find{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:13.5px;cursor:pointer;min-width:0;transition:border-color .15s}
.find:hover{border-color:var(--faint)}
.find span{white-space:nowrap}
kbd{font:500 11px var(--body);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--faint);background:var(--bg)}
.chip-s{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface)}
.chip-s .i{color:var(--accent)}
.readbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);height:2px;z-index:14;margin-bottom:-2px}
.readbar i{display:block;height:100%;width:0;background:var(--accent)}
.page{width:100%;max-width:1080px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:52px}
.page.in{animation:in .26s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot div{max-width:1048px;margin:0 auto}

/* building blocks */
.blk{display:flex;flex-direction:column;gap:18px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.more{font-size:14px;font-weight:500;text-decoration:none}
.more:hover{text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
.btn.quiet{background:none;color:var(--fg);border-color:var(--line)}
.btn.quiet:hover{background:var(--surface);filter:none}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{padding:18px 20px 0;display:flex;flex-direction:column;gap:4px}
.panel-h p{color:var(--muted);font-size:14px}
.panel-b{padding:18px 20px 20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--raised);border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.tag.Easy::before,.tag.ok::before{background:var(--good)} .tag.Medium::before{background:var(--warn)} .tag.Hard::before{background:var(--bad)}
.tag.plain::before{display:none}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center}
.hero-t{display:flex;flex-direction:column;gap:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.facts div{display:flex;gap:6px;align-items:baseline}
.facts dt{order:2} .facts dd{margin:0;font-weight:600;color:var(--fg)}

/* route cards */
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.route{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .2s,transform .2s;min-width:0}
.route:hover{border-color:var(--faint);transform:translateY(-2px)}
.art{position:relative;height:112px;border-radius:11px;overflow:hidden;background:var(--raised)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .grid line{stroke:var(--line);stroke-width:1}
.art .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.art-n{position:absolute;left:12px;top:10px;font-size:12.5px;color:var(--muted)}
.art-n b{font:600 26px/1 var(--display);color:var(--fg);margin-right:5px;letter-spacing:-.02em}
.route-b{padding:14px 12px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.route-b p{color:var(--muted);font-size:14px}
.route-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.go{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.route:hover .go,.stage.ready:hover .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.mini li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.mini li:first-child{border-top:0}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:2px;display:grid;place-items:center;color:var(--accent-ink)}
.dot.on{background:var(--good);border-color:var(--good)} .dot .i{width:12px;height:12px;stroke-width:2.6}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:inherit;transition:border-color .2s;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--faint)}
.tile p{font-size:13.5px;color:var(--muted)}

/* accordion */
.list{display:flex;flex-direction:column;gap:8px}
.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .2s}
.acc:hover,.acc.open{border-color:var(--faint)}
.acc-h{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:1.5}
.acc-h>.i{margin-top:3px;color:var(--faint);transition:transform .25s}
.acc.open .acc-h>.i{transform:rotate(90deg)}
.acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .3s}
.acc.open .acc-b>div{visibility:visible;transition-delay:0s}
.acc-in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;max-width:74ch}
.ans{background:var(--raised);border-radius:10px;padding:10px 12px;font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:none;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:min(320px,100%);font-size:14px}
.field::placeholder{color:var(--faint)}

/* road detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--fg)}
.prog{display:flex;flex-direction:column;gap:8px;max-width:520px}
.prog div:first-child{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.stage{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:inherit;transition:border-color .2s}
.stage.ready:hover{border-color:var(--faint)}
.stage.soon{opacity:.62}
.st-n{width:30px;height:30px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none}
.stage.done .st-n{background:var(--good);color:var(--accent-ink)}
.st-t{flex:1;min-width:0;display:flex;flex-direction:column}
.st-t b{font-weight:500}
.st-t small{color:var(--muted);font-size:12.5px}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,680px) 200px;gap:56px;align-items:start}
.lesson article{display:flex;flex-direction:column;gap:18px;min-width:0}
.lesson article h2{margin-top:22px;scroll-margin-top:90px}
.lesson article p{max-width:66ch}
.key{margin:6px 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);font:500 19px/1.45 var(--display);letter-spacing:-.01em}
.worked{background:var(--raised);border-radius:12px;padding:14px 16px;font:14px/1.75 var(--mono);overflow-x:auto;white-space:pre}
.rail{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.rail p{color:var(--faint);font-size:12.5px;margin-bottom:6px}
.rail button{background:none;border:0;border-left:2px solid var(--line);padding:5px 12px;text-align:left;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.rail button:hover{color:var(--fg)} .rail button.on{color:var(--fg);border-color:var(--accent)}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.pn a{border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:2px;transition:border-color .2s;background:var(--surface)}
.pn a:hover{border-color:var(--faint)} .pn small{color:var(--muted)} .pn a:last-child{text-align:right}
.done-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px;background:var(--surface)}

/* widgets */
.w{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:22px;align-items:center}
.w.stack{grid-template-columns:minmax(0,1fr)}
.ctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.sl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.sl-top{display:flex;justify-content:space-between;gap:10px}
.sl output{color:var(--fg);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--hover) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--hover)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--faint);margin-top:-6px;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--faint)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.ctl.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px}
.narrow{max-width:760px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:14px}
.kv{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.kv b{font:600 19px/1.2 var(--display);color:var(--fg);letter-spacing:-.01em}
.kv b.hi{color:var(--h1)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:11px var(--body);fill:var(--faint)}
.cap{font-size:12.5px;color:var(--faint);margin-top:10px}
.hb{display:grid;grid-template-columns:118px minmax(0,1fr) 112px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hb .trk{height:18px;border-radius:5px;background:var(--raised);overflow:hidden}
.hb .trk i{display:block;height:100%;border-radius:5px;background:var(--h2);transition:width .3s cubic-bezier(.2,.7,.2,1)}
.hb .trk i.neg{background:var(--bad)} .hb .trk i.a{background:var(--accent)} .hb .trk i.m{background:var(--faint)}
.hb span:last-child{text-align:right;font-weight:600}
.hb small{color:var(--muted);font-weight:400}
.verd{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;border-radius:999px;padding:4px 11px}
.verd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.verd.good{background:var(--good-soft);color:var(--good)} .verd.bad{background:var(--bad-soft);color:var(--bad)} .verd.mid{background:var(--warn-soft);color:var(--warn)}
.out{font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.out b{font-weight:600}
.case{font:500 18px/1.45 var(--display);letter-spacing:-.01em;max-width:52ch}
.big{font:600 30px/1.2 var(--display);letter-spacing:-.02em;min-height:38px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;align-self:flex-start;max-width:100%}
.seg button{background:none;border:0;border-radius:8px;padding:7px 13px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--fg)} .seg button.on{background:var(--raised);color:var(--fg)}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;font-size:14px;min-width:340px}
th,td{padding:9px 14px;text-align:right;border-radius:8px;background:var(--raised)}
th{background:none;color:var(--muted);font-weight:500;font-size:12.5px}
td.mid{background:var(--accent);color:var(--accent-ink);font-weight:600}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.term p{color:var(--muted);font-size:14px}
.memo{max-width:680px;display:flex;flex-direction:column;gap:10px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.memo:last-child{border-bottom:0}
.memo p{font-size:16px;line-height:1.7}

/* palette + toast */
.pal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;justify-items:center;align-items:start;padding:12vh 16px 0;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.pal-box{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:in .2s cubic-bezier(.2,.7,.2,1)}
.pal-box input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none}
.pal-out{max-height:46vh;overflow-y:auto;padding:6px}
.pal-r{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;font-size:14.5px}
.pal-r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-r small{color:var(--faint);flex:none}
.pal-r.sel{background:var(--raised)}
.pal-e{padding:18px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;padding:10px 16px;border-radius:999px;z-index:50;animation:in .2s}

@media (max-width:1180px){ .lesson{grid-template-columns:minmax(0,680px)} .rail{display:none} }
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;width:264px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.7,.2,1);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .menu{display:grid}
  .hero{grid-template-columns:minmax(0,1fr)} .routes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .routes,.two,.terms,.pn{grid-template-columns:minmax(0,1fr)} .w{grid-template-columns:minmax(0,1fr)}
  .find span,.find kbd{display:none} .page{gap:40px;padding-block:24px 48px}
  .hb{grid-template-columns:92px minmax(0,1fr) 92px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} .art .draw{stroke-dashoffset:0} }

<script>
(function(){

function money(n){return n>=1e7?'₹'+(n/1e7).toFixed(2)+' crore':n>=1e5?'₹'+(n/1e5).toFixed(2)+' lakh':'₹'+inr(n)}
var SUBJECTS=[
 ['Accounting',['Three statements','Accruals','Working capital','Leases','Deferred tax','Consolidation']],
 ['Valuation',['DCF','Multiples','Reverse DCF','Sum of the parts','Cost of capital','Terminal value']],
 ['Modelling',['Revenue build','Debt schedule','Circularity','Scenarios','Checks and balances']],

 ['Forensics',['Cash vs profit','Related parties','Capitalised costs','Auditor notes','Promoter pledges']],
 ['Market sense',['Earnings reactions','Consensus','Positioning','Guidance','Currency moves']],

 ['Rates and macro',['Duration','Yield curve','Inflation','Central banks']],
 ['Commodities',['Crude spreads','Metals','Gas','Freight']],
 ['Writing the note',['Thesis first','Variant view','Risks','Charts that argue']]
];

var ROADS=[
 {id:'scratch',t:'Starting from scratch',who:'No finance background yet.',s:['Read a profit and loss statement','Read a balance sheet','Read a cash flow statement','See how the three link','Ratios that matter','Time value of money','Your first DCF','Multiples and when they mislead','Build a one-page model']},
 {id:'campus',t:'Preparing for campus research roles',who:'Students with interviews in sight.',s:['Accounting drills','Valuation questions','Mental math under time','Learn one sector deeply','Build and defend a stock pitch','Market awareness: rates, crude, rupee','Mock interview']},
 {id:'ca',t:'Switching from audit or accounting',who:'You know the books; now forecast them.',s:['From reported numbers to drivers','Unit economics by sector','Forecasting working capital','DCF and cost of capital','Reading management commentary','Writing an initiation note']},
 {id:'eng',t:'Switching from engineering or data',who:'Strong with numbers, new to accounts.',s:['Accounting crash course','Three statements, linked','Spreadsheet modelling habits','Valuation without the jargon','How markets price news','Sector primer of your choice']},
 {id:'desk',t:'New on a research desk',who:'Your first six months.',s:['Earnings season workflow','Listening to a management call','Keeping a model current','Channel checks and primary data','Writing fast and short','Handling client questions']},
 {id:'beyond',t:'Beyond equities',who:'Directions, not one path.',s:['Credit: leverage, cover and covenants','Rates: duration and the curve','Commodities: spreads and inventories','Currencies: who gains when the rupee moves']}
];

var TRACKS=[
 {t:'Sell-side research associate',m:'8 weeks · 8–10 hrs a week',w:['Statements and ratios','Revenue and cost builds','Full three-statement model','DCF and multiples','One sector, end to end','Earnings preview and review notes','Stock pitch','Mock interviews']},
 {t:'Buy-side analyst',m:'10 weeks · 8–12 hrs a week',w:['Statements and cash quality','Return on capital and moats','Reverse DCF: what is priced in','Forensic checks','Position sizing and risk','Variant view against consensus','Pre-mortems','Two full pitches, long and short','Portfolio review','Mock interviews']},
 {t:'Credit analyst',m:'8 weeks · 8–10 hrs a week',w:['Cash flow before earnings','Leverage and cover ratios','Debt schedules','Covenants and documents','Downside cases','Ratings method','Bond maths and duration','Credit memo and mock']}
];

var QS=[
 {t:'Accounting',d:'Easy',q:'A company buys a machine for ₹100 cr in cash. What changes on the three statements that day?',a:'Cash −100, plant +100. Profit unchanged.',s:'Income statement: nothing yet; depreciation starts later. Cash flow: a ₹100 cr outflow under investing. Balance sheet: cash falls 100 and plant rises 100, so total assets stay the same.'},
 {t:'Accounting',d:'Medium',q:'Depreciation rises by ₹10 cr. The tax rate is 25%. What happens to net profit, cash and the balance sheet?',a:'Net profit −7.5, cash +2.5, assets −7.5, equity −7.5.',s:'Pre-tax profit falls 10, tax falls 2.5, so net profit falls 7.5. Depreciation is not cash, so add back 10: cash rises 2.5. Plant falls 10 and cash rises 2.5, so assets fall 7.5, matching the 7.5 fall in retained earnings.'},
 {t:'Accounting',d:'Medium',q:'Revenue grew 20% but receivables grew 60%. What might be going on, and what would you check?',a:'Customers are paying more slowly, or sales were pulled forward.',s:'Possible causes: looser credit terms to win sales, stock pushed to distributors before year end, a shift toward slower-paying customers, or an acquisition. Check receivable days over several years, cash from operations against profit, and the ageing note in the annual report.'},
 {t:'Accounting',d:'Hard',q:'A company starts capitalising ₹50 cr of costs it used to expense, over five years. Ignore tax. What happens in year one to EBITDA, EBIT, cash from operations and free cash flow?',a:'EBITDA +50, EBIT +40, operating cash +50, free cash flow unchanged.',s:'The 50 leaves operating costs, so EBITDA rises 50. Amortisation of 10 appears, so EBIT rises 40. In the cash flow statement the 50 moves from operations to investing. Free cash flow subtracts capex, so it does not change. This is why free cash flow is harder to flatter than EBITDA.'},
 {t:'Valuation',d:'Easy',q:'A business will produce ₹100 cr of free cash flow next year, growing 5% forever. The discount rate is 10%. What is it worth?',a:'₹2,000 cr.',s:'Value = next year\'s cash flow ÷ (discount rate − growth) = 100 ÷ (0.10 − 0.05) = 2,000.'},
 {t:'Valuation',d:'Easy',q:'Share price ₹500, earnings per share ₹25, growth 15%. What are the P/E and the PEG ratio?',a:'P/E 20×, PEG 1.33.',s:'P/E = 500 ÷ 25 = 20. PEG = P/E ÷ growth rate = 20 ÷ 15 = 1.33.'},
 {t:'Valuation',d:'Medium',q:'Two companies trade at 20 times earnings and both grow 8%. A earns a 25% return on equity, B earns 10%. Which is cheaper?',a:'A. It needs to reinvest far less to grow.',s:'Growth = return × share of profit reinvested. A reinvests 8 ÷ 25 = 32% and can pay out 68%. B reinvests 8 ÷ 10 = 80% and pays out 20%. Same price per rupee of profit, but A hands over more than three times the cash.'},
 {t:'Valuation',d:'Medium',q:'A company trades at 10× EV/EBITDA. Net debt is 2× EBITDA, depreciation is 20% of EBITDA, interest is 10% on debt, tax is 25%. What is the P/E?',a:'About 17.8×.',s:'Set EBITDA to 100. EV = 1,000, net debt = 200, equity value = 800. EBIT = 80, interest = 20, pre-tax profit = 60, net profit = 45. P/E = 800 ÷ 45 = 17.8.'},
 {t:'Valuation',d:'Hard',q:'Terminal value is 75% of your DCF. Is that a problem?',a:'Not by itself, but the terminal assumptions need testing.',s:'It is common for growing companies. Check four things: the exit multiple the terminal value implies, that growth is no higher than the economy\'s long-run growth, that reinvestment supports that growth (growth = return on capital × reinvestment rate), and that margins have reached a steady level. If not, extend the forecast period.'},
 {t:'Modelling',d:'Medium',q:'Revenue is ₹1,000 cr. Receivable days go from 45 to 60. What is the cash impact?',a:'About ₹41 cr of cash tied up.',s:'Extra receivables = revenue × extra days ÷ 365 = 1,000 × 15 ÷ 365 = 41.1. That reduces cash from operations in the year it happens.'},
 {t:'Modelling',d:'Medium',q:'Why does a circular reference appear when interest is calculated on average debt?',a:'Interest depends on closing debt, and closing debt depends on interest.',s:'Average debt uses the closing balance. The closing balance depends on cash flow after interest. Fixes: turn on iterative calculation, use the opening balance, or add a switch that breaks the loop when the model errors.'},
 {t:'Modelling',d:'Hard',q:'Your balance sheet is out by exactly the amount of dividends paid. Where do you look?',a:'Dividends are in one of cash or retained earnings, but not both.',s:'Dividends must reduce cash (through financing cash flow) and reduce retained earnings. If only one side is linked, the gap equals the dividend. An imbalance that matches a known line is the fastest kind to fix.'},
 {t:'Spot the flaw',d:'Medium',q:'A cement model forecasts 38 million tonnes of sales in FY29. Capacity is 30 mt, and a 5 mt plant starts in FY30. What is wrong?',a:'Sales exceed what the plants can make.',s:'Even running flat out, 30 mt of capacity cannot sell 38. Plants rarely run above about 90%, so around 27 mt is a realistic ceiling until FY30. The volume line needs to be tied to capacity.'},
 {t:'Spot the flaw',d:'Medium',q:'A consumer goods company sells through distributors on 30-day credit. The model has receivable days falling from 28 to 8. What is wrong?',a:'It collects faster than its own credit terms allow.',s:'Receivable days can only fall that far if the sales channel changes, for example to cash-and-carry. Without evidence of new terms, the forecast invents cash that will not arrive.'},
 {t:'Spot the flaw',d:'Hard',q:'A bank model grows loans 25% a year for five years while deposits grow 12%. The loan-to-deposit ratio starts at 85%. What breaks?',a:'The ratio reaches about 147%.',s:'Loans multiply by 1.25⁵ = 3.05, deposits by 1.12⁵ = 1.76. Ratio = 85% × 3.05 ÷ 1.76 = 147%. The gap must be borrowed at higher cost, which the margin forecast ignores, and tripling the loan book needs far more capital than retained profit provides.'},
 {t:'Spot the flaw',d:'Medium',q:'A commodity steel maker\'s EBITDA margin rises from 14% to 22% over five years with flat prices and no change in what it sells. What is wrong?',a:'There is no source for the margin gain.',s:'A commodity producer takes the market price. Margin can only rise through lower costs, and the model names none. Commodity margins also swing around a cycle average, so a straight line upward should make you suspicious.'},
 {t:'Mental math',d:'Easy',q:'Roughly, what is 1.15 to the power of 5?',a:'About 2.0.',s:'The rule of 72: money doubles in about 72 ÷ 15 = 4.8 years at 15%. So five years is almost exactly a double (2.01).'},
 {t:'Mental math',d:'Easy',q:'Revenue goes from ₹640 cr to ₹1,000 cr in four years. What is the yearly growth rate?',a:'About 11.8%.',s:'1,000 ÷ 640 = 1.5625. Take the square root twice: 1.25, then 1.118. So about 11.8% a year.'},
 {t:'Mental math',d:'Medium',q:'A price falls 20%, then rises 20%. Where does it end?',a:'4% below where it started.',s:'0.8 × 1.2 = 0.96. Equal percentage moves down and up never cancel, because the second one applies to a smaller base.'},
 {t:'Market sense',d:'Medium',q:'A company beats profit estimates by 10% and the stock falls 6%. Give three possible reasons.',a:'Poor quality of the beat, weaker guidance, or expectations above the published estimates.',s:'The beat may come from one-off gains or a low tax rate while sales or margins missed. Management may have cut its outlook. Investors may have expected more than the published numbers, or already owned a lot of the stock.'},
 {t:'Market sense',d:'Medium',q:'The rupee weakens 5% against the dollar. Which sectors gain and lose first?',a:'Exporters gain; importers and dollar borrowers lose.',s:'IT services and drug exporters earn dollars and spend rupees, so margins rise. Oil importers, airlines and electronics importers pay more. Companies with unhedged dollar debt see it grow in rupee terms.'},
 {t:'Credit',d:'Medium',q:'Net debt is 4× EBITDA and EBITDA covers interest 2×. EBITDA drops 30%. What are the new ratios?',a:'Leverage 5.7×, cover 1.4×.',s:'Leverage = 4 ÷ 0.7 = 5.7. Cover = 2 × 0.7 = 1.4. A modest fall in profit moves a leveraged company close to the point where it cannot pay interest.'},
 {t:'Rates',d:'Easy',q:'A bond has a duration of 7. Yields rise by 0.5 percentage points. Roughly how does its price move?',a:'Down about 3.5%.',s:'Price change ≈ −duration × change in yield = −7 × 0.5% = −3.5%.'}
];

var GLOSS=[['EBITDA','Profit before interest, tax, depreciation and amortisation; a rough measure of operating cash profit.'],['Enterprise value (EV)','What it costs to buy the whole business: the value of the shares plus net debt.'],['Free cash flow','Cash from operations minus spending on plant and equipment.'],['P/E ratio','Share price divided by earnings per share.'],['DCF','Valuing a business as the sum of its future cash flows, each discounted back to today.'],['Terminal value','The part of a DCF that covers every year after the forecast ends.'],['Cost of capital (WACC)','The blended return lenders and shareholders require.'],['Return on equity','Net profit divided by shareholders\' funds.'],['Working capital','Receivables plus inventory minus payables; cash tied up in day-to-day trading.'],['Receivable days','How long customers take to pay, on average.'],['Consensus','The average of brokers\' published forecasts for a company.'],['Initiation','The first full report an analyst publishes on a company.'],['Variant view','Where your forecast differs from consensus, and why.'],['Reverse DCF','Working back from the share price to the growth it assumes.'],['Channel check','Asking dealers, distributors or customers what is actually selling.'],['Duration','How much a bond\'s price moves when its yield moves.'],['Interest cover','Operating profit divided by interest cost.'],['Basis point','One hundredth of a percentage point.']];

var MEMOS=[
 ['Why EBITDA flatters heavy industries','EBITDA ignores the cost of replacing worn-out plant. For a software firm that hardly matters. For a cement or telecom company, replacement spending can eat half of it. Two companies on the same EV/EBITDA can differ widely on the cash left for shareholders. For asset-heavy sectors, compare on EBIT or free cash flow as well.'],
 ['Read the cash flow statement backwards','Start at the bottom: did cash go up or down? Then ask where it came from. Borrowing, selling shares and selling assets are all different from earning it. Only then look at operations, and compare operating cash with reported profit over five years. A persistent gap is the first thing to explain.'],
 ['What "priced in" means','A share price is a forecast. If a stock trades at 40 times earnings, buyers expect profit to grow for many years. A reverse DCF turns the price into that growth rate. The better step is to turn the growth into physical terms, such as tonnes, stores or customers, and ask whether the business could really deliver them.']
];

var FLAWS=[
 ['Cement maker: sales rise to 38 million tonnes in FY29. Capacity is 30 mt, with a new 5 mt plant due in FY30.',true,'Sales cannot exceed what the plants can produce.'],
 ['IT services firm: revenue grows 12%, headcount grows 10%, revenue per employee grows 2%.',false,'1.10 × 1.02 = 1.12. The pieces add up.'],
 ['Consumer goods firm on 30-day distributor credit: receivable days fall from 28 to 8.',true,'It would be collecting faster than its own credit terms.'],
 ['Retailer: 400 stores today, 520 in three years. It has opened 35 to 45 stores a year recently.',false,'40 stores a year matches its record.'],

 ['Hotel chain: occupancy rises from 71% to 96% and stays there all year.',true,'It leaves no room for weak seasons or rooms closed for upkeep.']

var RATES=[.07,.1,.13,.16,.2,.25];
var LESSONS=[
 {t:'Read a profit and loss statement',min:8,sum:'How a company gets from the money it takes in to the profit it keeps.',key:'A profit and loss statement answers one question: over this period, did the business earn more than it spent?',
  secs:[['From sales to profit','Start at the top with <b>revenue</b>, the value of everything sold. Subtract what it cost to make those goods and you have <b>gross profit</b>. Subtract salaries, rent and marketing and you have <b>operating profit</b>. Subtract interest and tax and what remains is <b>net profit</b>, the part that belongs to shareholders.'],['Margins make companies comparable','A ₹50 crore profit means little alone. Divide profit by revenue to get a <b>margin</b>. A company keeping 20 paise of every rupee is a very different business from one keeping 5 paise, whatever their size.'],['What the statement leaves out','Sales are recorded when they are earned, not when the customer pays. So a company can report a healthy profit while its bank balance shrinks. That gap is the subject of the next two lessons.']],
  w:'pnl',ex:'Revenue                1,000\nCost of goods           −600\nGross profit             400   (40% margin)\nOperating costs         −250\nOperating profit         150   (15% margin)\nInterest                 −30\nTax at 25% of 120        −30\nNet profit                90   (9% margin)',
  cq:'Revenue doubles and every cost doubles with it. What happens to the net margin?',ca:'Nothing. Profit doubles too, so profit divided by revenue is unchanged. Margins only move when costs grow slower or faster than sales.'},
 {t:'Read a balance sheet',min:7,sum:'What a business owns, what it owes, and who funded the difference.',key:'A balance sheet is a photograph: on one day, here is everything the business owns and everything it owes.',
  secs:[['Three blocks','<b>Assets</b> are what the company owns: cash, stock, factories, money customers owe it. <b>Liabilities</b> are what it owes: loans, unpaid supplier bills. <b>Equity</b> is what is left for the owners. Assets always equal liabilities plus equity.'],['Why it always balances','Every rupee of assets was paid for by someone. Either a lender or supplier provided it, which is a liability, or the owners did, which is equity. There is no third source, so the two sides must match.'],['What analysts look for','How much of the business is funded by debt. How much cash it holds. Whether money owed by customers and unsold stock are growing faster than sales, which often signals trouble before the profit line does.']],
  ex:'Raise equity             +100\nBorrow from a bank        +50\nBuy a plant              −120\n\nAssets:      cash 30 + plant 120  = 150\nFunded by:   debt 50 + equity 100 = 150',
  cq:'A company earns ₹20 crore and pays no dividend. Which parts of the balance sheet change?',ca:'Equity rises by 20 through retained earnings. Assets rise by 20 as well, as cash if customers paid, or as money owed by customers if they have not yet.'},
 {t:'Read a cash flow statement',min:8,sum:'Where the money actually came from, and where it went.',key:'Profit can be shaped by accounting choices. Cash in the bank cannot. The cash flow statement shows which one you are looking at.',
  secs:[['Three sections','<b>Operations</b>: cash from running the business. <b>Investing</b>: cash spent on plant and equipment, or raised by selling it. <b>Financing</b>: cash from lenders and shareholders, and cash returned to them.'],['Why profit and cash differ','Selling on credit adds to profit now and to cash later. Building up stock uses cash without touching profit. Depreciation cuts profit without using any cash. The statement starts from profit and undoes each of these.'],['Free cash flow','Take cash from operations and subtract spending on plant. What remains is <b>free cash flow</b>: money the company could hand to its owners without shrinking the business. It is the number most valuations are built on.']],
  ex:'Net profit                       90\nAdd back depreciation           +40\nCustomers owe 50 more           −50\nCash from operations             80\nSpending on plant               −60\nFree cash flow                   20',
  cq:'A company has reported profits for five years, but cash from operations has been negative every year. What do you suspect?',ca:'Profit is not turning into cash. Check whether money owed by customers or unsold stock keeps growing, and whether sales are being recorded earlier than they should be.'},
 {t:'See how the three link',min:7,sum:'One event, traced through all three statements.',key:'Net profit flows into equity. The cash flow statement explains the change in cash. The balance sheet holds both.',
  secs:[['Profit lands in equity','Whatever net profit is not paid out as dividends is added to <b>retained earnings</b>, a line inside equity. That is how one year of trading changes the balance sheet.'],['Cash flow explains the cash line','Opening cash plus the total of the cash flow statement equals closing cash. If your model does not tie here, something is linked wrongly.'],['One item touches everything','Depreciation shows the links at work. It lowers profit, it is added back in the cash flow, and it reduces the value of plant. Interviewers use it for exactly that reason.']],
  ex:'Depreciation rises by 10, tax rate 25%\n\nProfit before tax        −10\nTax                     +2.5\nNet profit              −7.5\nCash: −7.5 + 10 back    +2.5\nPlant                    −10\nAssets: +2.5 − 10       −7.5  =  equity −7.5',
  cq:'A company pays a ₹30 crore dividend. Trace it through the three statements.',ca:'The profit and loss statement does not change. Cash flow shows a 30 outflow under financing. On the balance sheet, cash falls 30 and retained earnings fall 30.'},
 {t:'Ratios that matter',min:8,sum:'Turning raw numbers into comparisons across companies and years.',key:'A single number says little. A ratio says how one number stands against another, and that is what lets you compare.',
  secs:[['Profitability','Margins show profit per rupee of sales. <b>Return on equity</b>, net profit divided by equity, shows profit per rupee the owners have put in. A business earning 20% on equity can grow far faster on its own money than one earning 8%.'],['Efficiency','<b>Receivable days</b>, money owed by customers divided by revenue, times 365, shows how long customers take to pay. Rising days mean more cash locked up to produce the same sales.'],['Leverage','Debt divided by equity shows how much of the business runs on borrowed money. <b>Interest cover</b>, operating profit divided by interest, shows how easily it can pay its lenders. Read ratios as a trend over years, not as one reading.']],
  ex:'Net profit 90 ÷ equity 600           = 15% return on equity\nReceivables 150 ÷ revenue 1,000 × 365 = 55 days\nOperating profit 150 ÷ interest 30    = 5× cover',
  cq:'Return on equity rises from 15% to 22% only because the company borrowed more. Is that an improvement?',ca:'Not by itself. Debt lifts the return on equity and the risk together. Check the return on all capital, debt included, to see whether the business itself got better.'},
 {t:'Time value of money',min:9,sum:'Why a rupee today beats a rupee next year, and how compounding works.',key:'Money today can be invested, so it is worth more than the same amount later. Every valuation rests on this.',
  secs:[['Compounding','Invest at a rate <i>r</i> and after <i>n</i> years each rupee becomes (1 + r)ⁿ. The growth earns growth of its own, which is why the curve bends upward instead of rising in a straight line.'],['Discounting','Run it backwards. A rupee arriving in <i>n</i> years is worth 1 ÷ (1 + r)ⁿ today. The further away the money and the higher the rate, the less it is worth now.'],['CAGR','The <b>compound annual growth rate</b> is the one steady rate that links a starting value to an ending value: (end ÷ start) to the power of 1 ÷ years, minus 1. It smooths a bumpy path into a single comparable number.']],
  w:'cagr',ex:'₹1,00,000 at 12% for 10 years\n  1.12¹⁰ = 3.106      →  ₹3,10,585\n\n₹1,00,000 arriving in 5 years, at 10%\n  1 ÷ 1.10⁵ = 0.621   →  ₹62,092 today',
  cq:'At 12% a year, roughly how long does money take to double?',ca:'About six years. Divide 72 by the rate: 72 ÷ 12 = 6. This rule of 72 works well for rates between about 5% and 20%.'},
 {t:'Your first DCF',min:10,sum:'Valuing a business as the cash it will produce.',key:'A business is worth the cash it will hand its owners in future, discounted back to today.',
  secs:[['Forecast the cash','Estimate free cash flow for each of the next five to ten years. This is where knowledge of the business matters: how much it can sell, at what margin, and how much it must reinvest.'],['Discount it','Divide each year of cash by (1 + r)ⁿ, where <i>r</i> is the return investors require. Riskier businesses get a higher rate, so their future cash counts for less.'],['Terminal value','A business does not stop after the forecast. If cash grows at a steady rate <i>g</i> forever, everything beyond the forecast is worth next year\'s cash ÷ (r − g). This one figure is often most of the answer, so test it hard.']],
  w:'dcf',ex:'Cash next year 100, growing 5% forever, rate 10%\n  100 ÷ (0.10 − 0.05)      = 2,000\nLess net debt               −400\nValue of the shares         1,600\n÷ 80 crore shares         = ₹200 a share',
  cq:'In that example, the discount rate moves from 10% to 11%. What happens to the value of the business?',ca:'It falls to 100 ÷ 0.06 = 1,667, a drop of about 17%. A one-point change in one input moved the answer by a sixth, which is why a DCF gives a range, not a number.'},
 {t:'Multiples and when they mislead',min:8,sum:'The shortcut everyone uses, and the traps inside it.',key:'A multiple is a DCF folded into one number. Growth, risk and returns are all still in there; you just cannot see them.',
  secs:[['The two you will meet first','<b>P/E</b> is the share price divided by earnings per share. <b>EV/EBITDA</b> is the value of the whole business, debt included, divided by operating profit before depreciation. The second lets you compare companies with different amounts of debt.'],['Why two companies deserve different multiples','Faster growth, higher returns on capital and lower risk all justify paying more per rupee of profit. A stock at 30 times earnings can be cheaper than one at 10 if it turns far more of its profit into cash for owners.'],['Three traps','Cyclical companies look cheapest at the peak, just before profit falls. Companies with heavy debt look cheap on P/E. And profit itself depends on accounting choices, so check what is inside it.']],
  ex:'Both companies: P/E 20, growth 8%\n\nA earns 25% on equity → reinvests 8 ÷ 25 = 32%, pays out 68%\nB earns 10% on equity → reinvests 8 ÷ 10 = 80%, pays out 20%\n\nSame price per rupee of profit. A hands over 3.4× the cash.',
  cq:'A steel maker trades at 5 times earnings when steel prices are at a record high. Is it cheap?',ca:'Probably not. Its profit is at a peak that will not last. On profit averaged across a full cycle, the multiple could be 12 or 15. For cyclical companies, a low P/E at the top is a warning.'},
 {t:'Build a one-page model',min:10,sum:'Linking a few assumptions so that changing one moves everything after it.',key:'A model is a chain of linked assumptions. Its value is in showing what must be true for a number to hold.',
  secs:[['Start from drivers','Do not type in revenue. Build it from what causes it: tonnes sold times price, stores times sales per store, customers times spend. Then every forecast is a claim about the real world that you can check.'],['Link the statements','Profit feeds equity. Depreciation and spending on plant move the asset base. The cash flow statement produces closing cash. Once linked, one change runs through all three statements by itself.'],['Add checks','The balance sheet must balance. Closing cash must match. And every driver must stay physically possible: a plant cannot sell more than it can make. Models rarely fail on arithmetic. They fail on assumptions nobody tested.']],
  ex:'Volume        10 million tonnes\nPrice         ₹5,000 a tonne     → revenue ₹5,000 crore\nProfit        ₹1,000 a tonne     → operating profit ₹1,000 crore\n\nCheck: capacity 12 mt × 90% = 10.8 mt.  Volume fits.',
  cq:'Your model has the company selling 14 million tonnes in year four. Capacity is 12 million and no new plant is planned. What do you do?',ca:'Treat it as an error. Either cap volume at what the plants can make, around 10.8 million tonnes at 90% use, or add a new plant with its cost and build time. A forecast that breaks a physical limit is wrong however neat the spreadsheet.'}

function curve(rate,hue,animate){var w=320,h=112,n=24,p=10,max=Math.pow(1+rate,n),pts=[],g='',i,id='g'+(++uid);
  for(i=0;i<=n;i++){var v=(Math.pow(1+rate,i)-1)/(max-1);pts.push((p+i/n*(w-2*p)).toFixed(1)+' '+(h-p-v*(h-2*p-30)).toFixed(1))}
  for(i=1;i<4;i++)g+='<line x1="0" x2="'+w+'" y1="'+(h*i/4)+'" y2="'+(h*i/4)+'"/>';
  for(i=1;i<8;i++)g+='<line y1="0" y2="'+h+'" x1="'+(w*i/8)+'" x2="'+(w*i/8)+'"/>';
  var line='M'+pts.join('L');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true" style="color:var(--h'+hue+')"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".32"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><g class="grid">'+g+'</g><path d="'+line+'L'+(w-p)+' '+h+'L'+p+' '+h+'Z" fill="url(#'+id+')"/><path class="'+(animate?'draw':'')+'" pathLength="1" d="'+line+'" fill="none" stroke="currentColor" stroke-width="2.200"/></svg>'}
function roadDone(r){return r.id==='scratch'?LESSONS.filter(function(_,i){return done[i+1]}).length:0}

function slider(id,label,min,max,step,val){return '<label class="sl" for="'+id+'"><span class="sl-top"><span>'+label+'</span><output id="'+id+'o"></output></span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></label>'}
function bindSliders(el,fn){Array.prototype.forEach.call(el.querySelectorAll('input[type=range]'),function(r){var f=function(){r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%')};f();r.addEventListener('input',function(){f();fn()})});fn()}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},1800)}
function streakNow(){var s=store.get('streak',{last:-1,n:0});return (s.last===DAY||s.last===DAY-1)?s.n:0}

  var n=streakNow();$('sk-n').textContent=n+(n===1?' day':' days');$('sk-top').innerHTML=ico('flame')+n;
  var w='';for(var i=6;i>=0;i--)w+='<i'+(i<n&&(i>0||all)?' class="on"':'')+'></i>';$('sk-w').innerHTML=w}

function mountCagr(el,hero){var id='c'+(++uid),sl=slider(id+'r','Growth rate a year',2,30,1,15)+slider(id+'y','Years',1,30,1,20);
  el.innerHTML=(hero?'<div class="chart" id="'+id+'c"></div><div class="ctl row2">'+sl+'</div>':'<div class="w"><div class="ctl">'+sl+'</div><div class="chart" id="'+id+'c"></div></div>')+'<div class="kvs" style="margin-top:16px"><div class="kv"><span>₹1 lakh grows to</span><b class="hi" id="'+id+'v"></b></div><div class="kv"><span>Multiple of your money</span><b id="'+id+'m"></b></div><div class="kv"><span>Without compounding</span><b id="'+id+'s"></b></div></div><p class="cap">The dashed line is the same rate with no compounding: growth on the original amount only.</p>';
  bindSliders(el,function(){var r=+$(id+'r').value/100,n=+$(id+'y').value,W=hero?520:380,H=hero?210:200,l=8,t=14,b=24,max=Math.pow(1+r,n),a=[],s=[],i;

    for(i=0;i<=n;i++){a.push(X(i).toFixed(1)+' '+Y(Math.pow(1+r,i)).toFixed(1));s.push(X(i).toFixed(1)+' '+Y(1+r*i).toFixed(1))}
    var gl='';for(i=1;i<=3;i++)gl+='<line x1="'+l+'" x2="'+(W-l)+'" y1="'+(t+(H-b-t)*i/4)+'" y2="'+(t+(H-b-t)*i/4)+'" stroke="var(--line)"/>';
    $(id+'c').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Growth of one lakh rupees over '+n+' years"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--h1)" stop-opacity=".3"/><stop offset="1" stop-color="var(--h1)" stop-opacity="0"/></linearGradient></defs>'+gl+'<line x1="'+l+'" x2="'+(W-l)+'" y1="'+(H-b)+'" y2="'+(H-b)+'" stroke="var(--faint)"/><path d="M'+a.join('L')+'L'+X(n)+' '+(H-b)+'L'+l+' '+(H-b)+'Z" fill="url(#'+id+'g)"/><path d="M'+s.join('L')+'" fill="none" stroke="var(--faint)" stroke-width="1.500" stroke-dasharray="5 5"/><path d="M'+a.join('L')+'" fill="none" stroke="var(--h1)" stroke-width="2.600" stroke-linejoin="round"/><circle cx="'+X(n)+'" cy="'+Y(max)+'" r="4.500" fill="var(--h1)"/><text x="'+l+'" y="'+(H-6)+'">Today</text><text x="'+(W-l)+'" y="'+(H-6)+'" text-anchor="end">Year '+n+'</text></svg>';
    $(id+'ro').textContent=Math.round(r*100)+'%';$(id+'yo').textContent=n;
    $(id+'v').textContent=money(1e5*max);$(id+'m').textContent=max.toFixed(max<10?2:1)+'×';$(id+'s').textContent=money(1e5*(1+r*n))})}

function mountFlaw(el){var fi=0,right=0;

  function show(){$('f-t').textContent=FLAWS[fi][0];$('f-r').innerHTML='';$('f-y').disabled=$('f-x').disabled=false;$('f-n').textContent='Case '+(fi+1)+' of '+FLAWS.length+', '+right+' right so far'}

    $('f-r').innerHTML='<div class="out" style="margin-top:6px"><span class="verd '+(ok?'good':'bad')+'">'+(ok?'Correct':'Not quite')+'</span><span>It is '+(f[1]?'a flaw':'fine')+'. '+f[2]+'</span><button class="btn quiet" id="f-nx" type="button">'+(last?'Start again, '+right+' of '+FLAWS.length+' right':'Next case')+'</button></div>';

function mountDrill(el){var ansV=0,score=0,asked=0,left=0;
  el.innerHTML='<div class="out"><div class="big" id="m-q">Ready when you are.</div><div class="row"><input class="field" id="m-a" type="number" step="any" inputmode="decimal" aria-label="Your answer" placeholder="Your answer" disabled style="width:160px"><button class="btn" id="m-go" type="button">Start</button><span class="small" id="m-s">Answers within 2% count. Press Enter to submit.</span></div></div>';
  var rnd=function(a){return a[Math.floor(Math.random()*a.length)]};
  function next(){var k=Math.floor(Math.random()*3);
    if(k===0){var p=rnd([5,12,15,18,25,35,40]),n=rnd([240,360,480,640,800,1200]);ansV=p*n/100;$('m-q').textContent='What is '+p+'% of '+n+'?'}
    else if(k===1){var a=rnd([200,400,500,800]),g=rnd([10,15,20,25,30,40,60]);ansV=g;$('m-q').textContent='Sales go from '+a+' to '+(a*(100+g)/100)+'. Growth in %?'}
    else{var e=rnd([8,12,15,20,25,40]),pe=rnd([12,15,18,22,30]);ansV=pe;$('m-q').textContent='Price '+(e*pe)+', earnings per share '+e+'. P/E?'}
    asked++;$('m-a').value='';$('m-a').focus()}
  function end(){clearInterval(timer);timer=null;$('m-a').disabled=true;$('m-go').textContent='Go again';$('m-q').textContent=score+' right in 60 seconds';$('m-s').textContent=(asked-1)+' answered'}
  $('m-go').addEventListener('click',function(){score=0;asked=0;left=60;$('m-a').disabled=false;$('m-go').textContent='Restart';clearInterval(timer);
    timer=setInterval(function(){left--;if(!$('m-s')){clearInterval(timer);return}$('m-s').textContent=left+'s left, '+score+' right';if(left<=0)end()},1000);$('m-s').textContent='60s left, 0 right';next()});
  $('m-a').addEventListener('keydown',function(e){if(e.key!=='Enter'||!timer||this.value==='')return;if(Math.abs(+this.value-ansV)<=Math.abs(ansV)*.02)score++;$('m-s').textContent=left+'s left, '+score+' right';next()})}
var MOUNT={flaw:mountFlaw,priced:mountPriced,cagr:mountCagr,dcf:mountDcf,drill:mountDrill,pnl:mountPnl};

/* ---------- views ---------- */
var R={},A={};
R.home=function(){var nx=0;while(nx<LESSONS.length&&done[nx+1])nx++;var started=nx>0&&nx<LESSONS.length;
  var tc={};QS.forEach(function(q){tc[q.t]=(tc[q.t]||0)+1});
  return '<section class="hero"><div class="hero-t"><h1>Build finance skills that compound.</h1><p class="lede">CAGR Club is a free place to learn equity research: ordered roadmaps, interview questions with worked answers, a short daily set, and tools you can break with your own hands.</p><div class="row"><a class="btn" href="#'+(started?'lesson-'+(nx+1):'road-scratch')+'">'+(started?'Continue lesson '+(nx+1):'Start from scratch')+'</a><a class="btn quiet" href="#daily">Try today\'s set</a></div><dl class="facts"><div><dd>'+LESSONS.length+'</dd><dt>lessons</dt></div><div><dd>'+QS.length+'</dd><dt>worked questions</dt></div><div><dd>'+TOOLS.length+'</dd><dt>tools</dt></div><div><dd>'+GLOSS.length+'</dd><dt>terms</dt></div></dl></div>'+
  '<div class="panel"><div class="panel-h"><h3>Compound annual growth rate</h3><p>The idea the club is named after. Move the sliders.</p></div><div class="panel-b" id="hero-w"></div></div></section>'+
  '<section class="blk"><div class="blk-h"><h2>Choose where you are starting</h2><a class="more" href="#roadmaps">All roadmaps and role tracks</a></div><div class="routes">'+ROADS.slice(0,3).map(routeCard).join('')+'</div></section>'+
  '<section class="two"><div class="panel"><div class="panel-h"><h3>Today\'s set</h3><p>Three questions, the same for everyone, new at midnight UTC.</p></div><div class="panel-b"><ul class="mini">'+todays.map(function(i){return '<li><span class="dot'+(solved[i]?' on':'')+'">'+(solved[i]?ico('check'):'')+'</span><span>'+QS[i].q+'</span></li>'}).join('')+'</ul><div class="row" style="margin-top:14px"><a class="btn quiet" href="#daily">Open today\'s set</a></div></div></div>'+
  '<div class="panel"><div class="panel-h"><h3>Question bank</h3><p>Every question opens to an answer and the working behind it.</p></div><div class="panel-b"><div class="counts">'+Object.keys(tc).map(function(t){return '<span class="tag plain">'+t+' '+tc[t]+'</span>'}).join('')+'</div><div class="row" style="margin-top:18px"><a class="btn quiet" href="#questions">Browse all '+QS.length+'</a></div></div></div></section>'+
  '<section class="blk"><div class="blk-h"><h2>Tools you can break</h2></div><div class="tiles">'+TOOLS.map(function(t){return '<button class="tile" type="button" data-tool="'+t[0]+'"><h3>'+t[1]+'</h3><p>'+t[2]+'</p></button>'}).join('')+'</div></section>'+
  '<section class="blk"><h2>Questions people ask first</h2><div class="list">'+[['What background do I need?','School-level arithmetic and curiosity about businesses. The first roadmap starts with how to read a profit and loss statement.'],['Which roles does this prepare for?','Sell-side research associate, buy-side analyst and credit analyst roles. Much of it carries over to investment banking and corporate finance interviews.'],['How is this different from a textbook?','Every idea comes with a question to answer and a tool to try. You learn a ratio by using it, then by spotting a forecast that breaks it.'],['How much time does it take each day?','The daily set takes about ten minutes. A lesson takes eight to ten.'],['Is any of this investment advice?','No. Companies in examples are invented, and nothing here recommends buying or selling a security.']].map(function(f){return accItem('<span>'+f[0]+'</span>','<p>'+f[1]+'</p>')}).join('')+'</div></section>'};
A.home=function(){mountCagr($('hero-w'),true)};

R.roadmaps=function(){return '<section class="blk"><h1>Roadmaps</h1><p class="lede">Each roadmap is an ordered list of stages. Pick the one that matches where you are today. The first has full lessons; the others are outlines for now.</p><div class="routes">'+ROADS.map(routeCard).join('')+'</div></section>'+
  '<section class="blk"><h2>Role tracks</h2><p class="lede">Week-by-week plans for one specific seat.</p><div class="list">'+TRACKS.map(function(t){return accItem('<span><b style="font-weight:600">'+t.t+'</b></span><span class="small">'+t.m.replace(' · ',', ')+'</span>',t.w.map(function(w,i){return '<p><span class="small">Week '+(i+1)+'</span>&nbsp;&nbsp;'+w+'</p>'}).join(''))}).join('')+'</div></section>'};

R.road=function(id){var r=ROADS.filter(function(x){return x.id===id})[0];if(!r)return R.roadmaps();var full=id==='scratch',n=roadDone(r);
  return '<section class="blk narrow"><a class="back" href="#roadmaps">'+ico('back')+'All roadmaps</a><h1>'+r.t+'</h1><p class="lede">'+r.who+(full?' Nine lessons, about eight minutes each.':' This roadmap is an outline. Lessons are being written.')+'</p>'+
  (full?'<div class="prog"><div><span>Your progress</span><span>'+n+' of '+r.s.length+'</span></div><div class="bar"><i style="width:'+(n/r.s.length*100)+'%"></i></div></div>':'')+
  '<div class="list">'+r.s.map(function(s,i){return full?'<a class="stage ready'+(done[i+1]?' done':'')+'" href="#lesson-'+(i+1)+'"><span class="st-n">'+(done[i+1]?ico('check'):i+1)+'</span><span class="st-t"><b>'+LESSONS[i].t+'</b><small>'+LESSONS[i].min+' minute lesson</small></span><span class="go">'+ico('chev')+'</span></a>':'<div class="stage soon"><span class="st-n">'+(i+1)+'</span><span class="st-t"><b>'+s+'</b><small>Not written yet</small></span></div>'}).join('')+'</div></section>'};

R.lesson=function(k){var n=+k,L=LESSONS[n-1];if(!L)return R.road('scratch');var rail='',body='';
  L.secs.forEach(function(s,i){body+='<h2 id="s'+i+'">'+s[0]+'</h2><p>'+s[1]+'</p>';rail+='<button type="button" data-jump="s'+i+'">'+s[0]+'</button>'});
  if(L.w){body+='<h2 id="sw">Try it</h2><div class="panel"><div class="panel-b" id="lw"></div></div>';rail+='<button type="button" data-jump="sw">Try it</button>'}
  rail+='<button type="button" data-jump="se">Worked example</button><button type="button" data-jump="sc">Check yourself</button>';
  return '<div class="lesson"><article><a class="back" href="#road-scratch">'+ico('back')+'Starting from scratch</a><p class="small">Lesson '+n+' of '+LESSONS.length+', about '+L.min+' minutes</p><h1>'+L.t+'</h1><p class="lede">'+L.sum+'</p><p class="key">'+L.key+'</p>'+body+
  '<h2 id="se">Worked example</h2><div class="worked">'+L.ex+'</div><h2 id="sc">Check yourself</h2>'+accItem('<span>'+L.cq+'</span>','<p>'+L.ca+'</p>')+
  '<div class="done-row"><span>'+(done[n]?'You finished this lesson.':'Finished reading?')+'</span><button class="btn'+(done[n]?' quiet':'')+'" type="button" data-done="'+n+'">'+(done[n]?'Mark as not done':'Mark lesson complete')+'</button></div>'+
  '<nav class="pn">'+(n>1?'<a href="#lesson-'+(n-1)+'"><small>Previous</small>'+LESSONS[n-2].t+'</a>':'<span></span>')+(n<LESSONS.length?'<a href="#lesson-'+(n+1)+'"><small>Next</small>'+LESSONS[n].t+'</a>':'<a href="#questions"><small>Next</small>Practise in the question bank</a>')+'</nav></article><aside class="rail"><p>On this page</p>'+rail+'</aside></div>'};
A.lesson=function(k){var L=LESSONS[+k-1];if(L&&L.w)MOUNT[L.w]($('lw'));spy()};

function qList(){var idx=[];QS.forEach(function(q,i){if((fT==='All'||q.t===fT)&&(fD==='All'||q.d===fD)&&(!fS||(q.q+' '+q.t+' '+q.a).toLowerCase().indexOf(fS)>-1))idx.push(i)});
  var dn=Object.keys(solved).filter(function(k){return solved[k]}).length;
  $('q-c').textContent=idx.length+' of '+QS.length+' shown, '+dn+' solved';
  $('q-l').innerHTML=idx.length?idx.map(qItem).join(''):'<p class="small">No questions match. Clear the search or choose another topic.</p>'}
R.questions=function(){var topics=['All'];QS.forEach(function(q){if(topics.indexOf(q.t)<0)topics.push(q.t)});
  return '<section class="blk" style="max-width:860px"><h1>Question bank</h1><p class="lede">Open a question to see the answer and the working. Tick the ones you solved.</p><input class="field" id="q-s" type="search" placeholder="Filter questions" aria-label="Filter questions" value="'+fS+'"><div class="chips" id="q-t">'+topics.map(function(t){return '<button type="button" class="chip'+(t===fT?' on':'')+'" data-topic="'+t+'">'+t+'</button>'}).join('')+'</div><div class="chips">'+['All','Easy','Medium','Hard'].map(function(d){return '<button type="button" class="chip'+(d===fD?' on':'')+'" data-diff="'+d+'">'+d+'</button>'}).join('')+'</div><p class="small" id="q-c"></p><div class="list" id="q-l"></div></section>'};
A.questions=function(){qList();$('q-s').addEventListener('input',function(){fS=this.value.trim().toLowerCase();qList()})};

R.daily=function(){var term=GLOSS[DAY%GLOSS.length];
  return '<section class="blk narrow"><p class="small">No. '+Math.max(1,DAY-BASE+1)+', '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})+'</p><h1>Today\'s set</h1><p class="lede">Three questions, the same for everyone, new at midnight UTC. Tick all three to keep your streak.</p><div class="list">'+todays.map(qItem).join('')+'</div><div class="out" id="d-s"></div></section><section class="blk"><h2>Term of the day</h2><div class="term" style="max-width:520px"><h3>'+term[0]+'</h3><p>'+term[1]+'</p></div></section>'};
function dStatus(){if(!$('d-s'))return;var n=todays.filter(function(i){return solved[i]}).length;$('d-s').innerHTML=n===3?'<span class="verd good">Done for today</span><span>Your streak is <b>'+streakNow()+'</b>. A new set arrives at midnight UTC.</span>':'<span class="small">'+n+' of 3 solved today</span>'}
A.daily=dStatus;

R.tools=function(){return '<section class="blk"><h1>Tools</h1><p class="lede">Small experiments. Change an assumption and watch what it does to the answer. Companies and figures are invented.</p><div class="seg" role="tablist">'+TOOLS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" class="'+(t[0]===toolTab?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div><div class="panel"><div class="panel-h" id="t-h"></div><div class="panel-b" id="t-b"></div></div></section>'};
A.tools=function(){var t=TOOLS.filter(function(x){return x[0]===toolTab})[0];clearInterval(timer);timer=null;$('t-h').innerHTML='<h3>'+t[1]+'</h3><p>'+t[2]+'</p>';MOUNT[toolTab]($('t-b'));
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.className=b.dataset.tab===toolTab?'on':''})};

function gList(){$('g-l').innerHTML=GLOSS.filter(function(g){return !gF||(g[0]+g[1]).toLowerCase().indexOf(gF)>-1}).map(function(g){return '<div class="term"><h3>'+g[0]+'</h3><p>'+g[1]+'</p></div>'}).join('')||'<p class="small">No terms match.</p>'}
R.glossary=function(){return '<section class="blk"><h1>Glossary</h1><p class="lede">The desk\'s vocabulary, one plain sentence each.</p><input class="field" id="g-s" type="search" placeholder="Filter terms" aria-label="Filter terms" value="'+gF+'"><div class="terms" id="g-l"></div></section>'};
A.glossary=function(){gList();$('g-s').addEventListener('input',function(){gF=this.value.trim().toLowerCase();gList()})};
R.memos=function(){return '<section class="blk"><h1>Memos</h1><p class="lede">Short notes, one idea each.</p>'+MEMOS.map(function(m){return '<article class="memo"><h2>'+m[0]+'</h2><p>'+m[1]+'</p></article>'}).join('')+'</section>'};

/* ---------- shell ---------- */
var NAV=[['Learn',[['home','Home','home'],['roadmaps','Roadmaps','map']]],['Practise',[['questions','Question bank','list'],['daily','Daily set','cal'],['tools','Tools','tool']]],['Library',[['glossary','Glossary','book'],['memos','Memos','note']]]];
var TITLES={home:'Home',roadmaps:'Roadmaps',questions:'Question bank',daily:'Daily set',tools:'Tools',glossary:'Glossary',memos:'Memos'};
$('nav').innerHTML=NAV.map(function(g){return '<div class="nav-g" style="margin-bottom:18px"><span class="nav-l">'+g[0]+'</span>'+g[1].map(function(a){return '<a class="nav-a" data-nav="'+a[0]+'" href="#'+a[0]+'">'+ico(a[2])+a[1]+'</a>'}).join('')+'</div>'}).join('');
$('menu').innerHTML=ico('menu');$('theme').innerHTML=ico('theme')+'Switch theme';
$('find').innerHTML=ico('search')+'<span>Search</span><kbd>'+(/Mac|iPhone|iPad/.test(navigator.platform||'')?'⌘K':'Ctrl K')+'</kbd>';
function drawer(o){$('side').classList.toggle('open',o);$('scrim').hidden=!o}
$('menu').addEventListener('click',function(){drawer(true)});$('scrim').addEventListener('click',function(){drawer(false)});
var th=store.get('theme',null);if(th)document.documentElement.setAttribute('data-theme',th);
$('theme').addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('theme',nx)});

function parse(){var h=(location.hash||'').replace('#',''),m;
  if((m=h.match(/^road-([a-z]+)$/)))return ['road',m[1]];if((m=h.match(/^lesson-(\d+)$/)))return ['lesson',m[1]];
  return [R[h]&&h!=='road'&&h!=='lesson'?h:'home'];}
function go(){var p=parse(),name=p[0],v=$('view');clearInterval(timer);timer=null;drawer(false);
  v.innerHTML=R[name](p[1]);if(A[name])A[name](p[1]);
  var key=name==='road'||name==='lesson'?'roadmaps':name;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-a'),function(a){a.classList.toggle('on',a.dataset.nav===key)});
  var c='<a href="#home">CAGR Club</a><span class="sep">/</span>';
  if(name==='road'){var r=ROADS.filter(function(x){return x.id===p[1]})[0];c+='<a href="#roadmaps">Roadmaps</a><span class="sep">/</span><b>'+(r?r.t:'')+'</b>'}
  else if(name==='lesson'){c+='<a href="#road-scratch">Starting from scratch</a><span class="sep">/</span><b>'+(LESSONS[+p[1]-1]?LESSONS[+p[1]-1].t:'')+'</b>'}
  else c+='<b>'+TITLES[name]+'</b>';
  $('crumb').innerHTML=c;$('readbar').style.width='0';
  window.scrollTo(0,0);v.classList.remove('in');void v.offsetWidth;v.classList.add('in');syncStreak()}
window.addEventListener('hashchange',go);

function spy(){var hs=document.querySelectorAll('.lesson article h2'),bs=document.querySelectorAll('.rail button'),cur=0,i;
  if(!hs.length){$('readbar').style.width='0';return}
  for(i=0;i<hs.length;i++){if(hs[i].getBoundingClientRect().top<140)cur=i}
  for(i=0;i<bs.length;i++)bs[i].classList.toggle('on',i===cur);
  var d=document.documentElement,max=d.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'}
var tick=false;window.addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;spy()})},{passive:true});

document.addEventListener('click',function(e){var t=e.target,b;
  if((b=t.closest('.acc-h'))){var a=b.parentNode,o=!a.classList.contains('open');a.classList.toggle('open',o);b.setAttribute('aria-expanded',o);return}
  if((b=t.closest('[data-topic]'))){fT=b.dataset.topic;Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.toggle('on',x===b)});qList();return}
  if((b=t.closest('[data-diff]'))){fD=b.dataset.diff;Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.toggle('on',x===b)});qList();return}
  if((b=t.closest('[data-tab]'))){toolTab=b.dataset.tab;A.tools();return}
  if((b=t.closest('[data-tool]'))){toolTab=b.dataset.tool;if(location.hash==='#tools')go();else location.hash='tools';return}
  if((b=t.closest('[data-jump]'))){var el=$(b.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if((b=t.closest('[data-done]'))){var n=b.dataset.done;done[n]=!done[n];store.set('done',done);toast(done[n]?'Lesson marked complete':'Lesson marked as not done');var y=window.scrollY;$('view').innerHTML=R.lesson(n);A.lesson(n);window.scrollTo(0,y);return}
  if(t===$('pal'))closePal();
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.solve==null)return;solved[t.dataset.solve]=t.checked;store.set('solved',solved);
  var a=t.closest('.acc'),tg=a.querySelector('.tags'),ok=tg.querySelector('.ok');if(t.checked&&!ok)tg.insertAdjacentHTML('beforeend','<span class="tag ok">Solved</span>');if(!t.checked&&ok)ok.remove();
  syncStreak();dStatus();if($('q-c'))$('q-c').textContent=$('q-c').textContent.replace(/\d+ solved/,Object.keys(solved).filter(function(k){return solved[k]}).length+' solved')});

/* ---------- search palette ---------- */
var IDX=[],sel=0,hits=[];
Object.keys(TITLES).forEach(function(k){IDX.push([TITLES[k],'Page',function(){location.hash=k}])});
LESSONS.forEach(function(l,i){IDX.push([l.t,'Lesson',function(){location.hash='lesson-'+(i+1)}])});
ROADS.forEach(function(r){IDX.push([r.t,'Roadmap',function(){location.hash='road-'+r.id}])});
TOOLS.forEach(function(t){IDX.push([t[1],'Tool',function(){toolTab=t[0];if(location.hash==='#tools')go();else location.hash='tools'}])});
GLOSS.forEach(function(g){IDX.push([g[0],'Term',function(){gF=g[0].toLowerCase();if(location.hash==='#glossary')go();else location.hash='glossary'}])});
QS.forEach(function(q){IDX.push([q.q,'Question',function(){fT='All';fD='All';fS=q.q.slice(0,28).toLowerCase();if(location.hash==='#questions')go();else location.hash='questions'}])});
function palRender(){var s=$('pal-in').value.trim().toLowerCase();hits=IDX.filter(function(x){return !s||x[0].toLowerCase().indexOf(s)>-1}).slice(0,s?9:8);if(sel>=hits.length)sel=0;
  $('pal-out').innerHTML=hits.length?hits.map(function(h,i){return '<button type="button" class="pal-r'+(i===sel?' sel':'')+'" data-i="'+i+'"><span>'+h[0]+'</span><small>'+h[1]+'</small></button>'}).join(''):'<p class="pal-e">Nothing matches. Try a shorter word.</p>'}
function openPal(){$('pal').hidden=false;$('pal-in').value='';sel=0;palRender();$('pal-in').focus()}
function closePal(){$('pal').hidden=true}
function pick(i){var h=hits[i];if(!h)return;closePal();h[2]()}
$('find').addEventListener('click',openPal);$('pal-in').addEventListener('input',function(){sel=0;palRender()});
$('pal-out').addEventListener('click',function(e){var b=e.target.closest('.pal-r');if(b)pick(+b.dataset.i)});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('pal').hidden?openPal():closePal();return}
  if($('pal').hidden)return;
  if(e.key==='Escape')closePal();
  else if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(1,hits.length);palRender()}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+hits.length)%Math.max(1,hits.length);palRender()}
  else if(e.key==='Enter'){e.preventDefault();pick(sel)}});

go();
})();
</script>
