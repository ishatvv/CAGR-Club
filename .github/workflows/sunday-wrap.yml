name: Sunday Wrap
on:
  schedule:
    - cron: '20 3 * * 0'   # Sunday 08:50 IST
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (do not send)'
        type: boolean
        default: true
jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sunday-wrap.js ${{ (github.event_name == 'workflow_dispatch' && inputs.preview) && '--preview' || '' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wrap-preview, path: wrap-preview.html, if-no-files-found: ignore }
